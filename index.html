  .hx-play { transition: transform 0.2s ease; }
  .hx-video:hover .hx-play { transform: scale(1.08); }

  .hx-btn-secondary { background: transparent; color: #0E0E10; font-family: 'General Sans', sans-serif; font-weight: 500; font-size: 15px; letter-spacing: -0.005em; padding: 14px 24px; border: 1px solid #0E0E10; border-radius: 999px; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; }
  .hx-btn-secondary:hover { background: #0E0E10; color: #FFFFFF; }
  .hx-quiz-option { border: 1px solid #E5E2DD; background: #FFFFFF; padding: 18px 22px; cursor: pointer; text-align: left; font-family: 'General Sans', sans-serif; font-size: 16px; color: #0E0E10; width: 100%; transition: all 0.15s ease; line-height: 1.55; border-radius: 4px; }
  .hx-quiz-option:hover { border-color: #0E0E10; transform: translateX(4px); }
  .hx-eyebrow { font-family: 'General Sans', sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6B70; }
  .hx-checklist-item { display: flex; gap: 16px; padding: 18px 0; border-bottom: 1px solid #E5E2DD; cursor: pointer; transition: padding-left 0.15s ease; }
  .hx-checklist-item:hover { padding-left: 8px; }
  .hx-checklist-item:last-child { border-bottom: none; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .hx-fade { animation: fadeUp 0.5s ease forwards; }

function QuizView({ quizStep, setQuizStep, answers, setAnswers, onComplete }) {
  const q = QUIZ[quizStep];
  const progress = ((quizStep + 1) / QUIZ.length) * 100;
  const choose = (pts) => {
    const next = [...answers, pts];
    setAnswers(next);
    if (quizStep + 1 >= QUIZ.length) onComplete(next.reduce((a, b) => a + b, 0) * 2);
    else setQuizStep(quizStep + 1);
  };
  return (
    <div className="hx-fade" style={{ padding: "80px 0", maxWidth: "760px", margin: "0 auto" }}>
      <div style={{ marginBottom: "48px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px" }}>
          <span className="hx-eyebrow">Calibration · {quizStep + 1} of {QUIZ.length}</span>
          <span className="hx-eyebrow">No wrong answers</span>
        </div>
        <div style={{ height: "2px", background: "#E5E2DD", overflow: "hidden" }}>
          <div className="hx-grad-bg" style={{ height: "100%", width: `${progress}%`, transition: "width 0.4s ease" }} />
        </div>
      </div>
      <h2 className="hx-display" style={{ fontSize: "40px", lineHeight: 1.15, margin: "0 0 40px" }}>{q.q}</h2>
      <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
        {q.options.map((opt, i) => (
          <button key={i} className="hx-quiz-option" onClick={() => choose(opt.pts)}>
            <span className="hx-italic" style={{ fontSize: "20px", marginRight: "14px", color: "#A0A0A5" }}>{String.fromCharCode(97 + i)}.</span>
            {opt.label}
          </button>
        ))}
      </div>
    </div>
  );
}

      </h1>
      <p className="hx-italic" style={{ fontSize: "24px", color: "#6B6B70", margin: "0 0 48px" }}>{m.sub}</p>

      <a href={`https://www.youtube.com/watch?v=${m.videoId}`} target="_blank" rel="noreferrer" className="hx-video"
        style={{ display: "block", position: "relative", paddingBottom: "56.25%", height: 0, marginBottom: "16px", borderRadius: "8px", overflow: "hidden", border: "1px solid #E5E2DD", textDecoration: "none", background: "#0E0E10" }}>
        <div className="hx-grad-bg" style={{ position: "absolute", inset: 0, opacity: 0.16 }} />
        <div style={{ position: "absolute", inset: 0, background: "radial-gradient(120% 120% at 50% -10%, rgba(255,255,255,0.06) 0%, rgba(14,14,16,0) 55%)" }} />
        <div style={{ position: "absolute", left: "22px", bottom: "18px", right: "150px" }}>
          <div className="hx-display" style={{ color: "#FFFFFF", fontSize: "clamp(18px, 2.4vw, 24px)", lineHeight: 1.1 }}>{m.title}</div>
          <div className="hx-eyebrow" style={{ color: "rgba(255,255,255,0.7)", marginTop: "4px" }}>{m.speaker} · {m.duration}</div>
        </div>
        <img src={m.thumbnailUrl} referrerPolicy="no-referrer" alt={`${m.title} — ${m.speaker}`}
          onLoad={(e) => { const img = e.currentTarget; if (img.naturalWidth && img.naturalWidth <= 121 && img.dataset.fb !== "1") { img.dataset.fb = "1"; img.src = `https://i.ytimg.com/vi/${m.videoId}/hqdefault.jpg`; } }}
          onError={(e) => { const img = e.currentTarget; if (img.dataset.fb !== "1") { img.dataset.fb = "1"; img.src = `https://i.ytimg.com/vi/${m.videoId}/hqdefault.jpg`; } else { img.style.display = "none"; } }}
          style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }} />
        <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, rgba(14,14,16,0.3) 0%, rgba(14,14,16,0) 28%, rgba(14,14,16,0) 70%, rgba(14,14,16,0.34) 100%)" }} />
        <div className="hx-eyebrow" style={{ position: "absolute", top: "20px", left: "22px", color: "rgba(255,255,255,0.9)", textShadow: "0 1px 6px rgba(0,0,0,0.6)" }}>Module /{m.num} · Video</div>
        <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <div className="hx-grad-bg hx-play" style={{ width: "76px", height: "76px", borderRadius: "999px", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 10px 36px rgba(0,0,0,0.5)" }}>
            <Play size={30} color="#FFFFFF" fill="#FFFFFF" style={{ marginLeft: "5px" }} />
          </div>
        </div>
        <div style={{ position: "absolute", bottom: "16px", right: "16px", background: "rgba(14,14,16,0.78)", color: "#FFFFFF", padding: "7px 14px", borderRadius: "999px", fontSize: "13px", fontWeight: 500, display: "flex", alignItems: "center", gap: "6px", backdropFilter: "blur(4px)" }}>
          <ExternalLink size={13} /> Watch on YouTube
        </div>
      </a>
      <p className="hx-eyebrow" style={{ marginBottom: "48px", color: "#A0A0A5" }}>Opens in a new tab</p>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: "60px", marginBottom: "60px" }}>
        <div>
          <div className="hx-eyebrow" style={{ marginBottom: "12px" }}>Why this one</div>
          <h3 className="hx-display" style={{ fontSize: "32px", margin: 0, lineHeight: 1.05 }}><span className="hx-italic">Featuring</span><br />{m.speaker}</h3>
        </div>
        <p style={{ fontSize: "18px", lineHeight: 1.6, color: "#1F1F23", margin: 0 }}>{m.why}</p>
      </div>

      <div className="hx-rule" style={{ marginBottom: "60px" }} />

      <div style={{ marginBottom: "60px" }}>
        <h3 className="hx-display" style={{ fontSize: "36px", margin: "0 0 28px" }}>Three things to <span className="hx-italic">walk away with</span></h3>
        <div style={{ display: "flex", flexDirection: "column" }}>
          {m.takeaways.map((t, i) => (
            <div key={i} style={{ display: "flex", gap: "32px", alignItems: "start", padding: "28px 0", borderTop: "1px solid #E5E2DD", borderBottom: i === m.takeaways.length - 1 ? "1px solid #E5E2DD" : "none" }}>
              <span className="hx-display" style={{ fontSize: "44px", lineHeight: 1, color: "#A0A0A5", minWidth: "80px" }}>/0{i + 1}</span>
              <p style={{ fontSize: "18px", lineHeight: 1.5, margin: 0, fontWeight: 400, color: "#1F1F23" }}>{t}</p>
            </div>
          ))}
        </div>
      </div>

      <div style={{ background: "#0E0E10", color: "#FFFFFF", padding: "48px", marginBottom: "60px", borderRadius: "8px" }}>
        <div className="hx-eyebrow" style={{ color: "#A0A0A5", marginBottom: "16px" }}>This week's drill</div>
        <h3 className="hx-display" style={{ fontSize: "36px", margin: "0 0 20px", lineHeight: 1.05 }}>Try this on <span className="hx-italic hx-grad-text">real work.</span></h3>
        <p style={{ fontSize: "18px", lineHeight: 1.6, margin: 0, color: "#E5E2DD" }}>{m.exercise}</p>
      </div>

      <div style={{ marginBottom: "60px", textAlign: "center", padding: "40px 0", borderTop: "1px solid #E5E2DD", borderBottom: "1px solid #E5E2DD" }}>
        <button className={isDone ? "hx-btn-secondary" : "hx-btn-primary"} onClick={() => saveCompleted({ ...completed, [m.id]: !isDone })}>
          {isDone ? <React.Fragment><CheckCircle2 size={16} /> Completed · click to undo</React.Fragment> : <React.Fragment><CheckCircle2 size={16} /> Mark module complete</React.Fragment>}
        </button>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: "16px", flexWrap: "wrap" }}>
        {prev ? <button className="hx-btn-secondary" onClick={() => setActiveModule(prev)}>← /{prev.num} {prev.title}</button> : <div />}
        {next ? <button className="hx-btn-primary" onClick={() => setActiveModule(next)}>Next: {next.title} <ArrowRight size={16} /></button>
              : <button className="hx-btn-primary" onClick={() => setView("home")}>Back to overview <ArrowRight size={16} /></button>}
      </div>
    </div>
  );
}

function ChecklistView({ checked, saveChecked, setView, setActiveModule }) {
  const count = Object.values(checked).filter(Boolean).length;
  const toggle = (id) => saveChecked({ ...checked, [id]: !checked[id] });
  return (
    <div className="hx-fade" style={{ padding: "60px 0", maxWidth: "880px", margin: "0 auto" }}>
      <button onClick={() => setView("home")} style={{ background: "none", border: "none", cursor: "pointer", fontFamily: "'General Sans', -apple-system, BlinkMacSystemFont, sans-serif", fontSize: "13px", color: "#6B6B70", padding: 0, marginBottom: "24px" }}>← Back to masterclass</button>
      <div className="hx-eyebrow" style={{ marginBottom: "20px" }}>Practitioner's checklist</div>
      <h1 className="hx-display" style={{ fontSize: "clamp(56px, 8vw, 96px)", lineHeight: 0.95, margin: "0 0 24px" }}>The Persuasion <span className="hx-italic hx-grad-text">Checklist.</span></h1>
      <p style={{ fontSize: "20px", lineHeight: 1.5, color: "#3A3A3F", margin: "0 0 16px", maxWidth: "640px" }}>Twelve highest-leverage moves a product designer can run on real work this week. Distilled from across the masterclass — each linked back to the module it came from.</p>
      <p className="hx-italic" style={{ fontSize: "16px", color: "#6B6B70", margin: "0 0 48px" }}>Tick them off as you put each one into practice. Progress saves automatically.</p>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "20px 0", borderTop: "1px solid #0E0E10", borderBottom: "1px solid #E5E2DD" }}>
        <span className="hx-display" style={{ fontSize: "28px" }}>{count} <span style={{ color: "#A0A0A5" }}>of 12 in practice</span></span>
        <div style={{ width: "200px", height: "2px", background: "#E5E2DD", overflow: "hidden" }}>
          <div className="hx-grad-bg" style={{ height: "100%", width: `${(count / 12) * 100}%`, transition: "width 0.4s ease" }} />
        </div>
      </div>
      <div>
        {CHECKLIST.map((item, i) => {
          const isChecked = !!checked[item.id];
          const linkedModule = MODULES.find((m) => m.num === item.from);
          return (
            <div key={item.id} className="hx-checklist-item" onClick={() => toggle(item.id)} style={{ alignItems: "start" }}>
              <span className="hx-display" style={{ fontSize: "20px", color: "#A0A0A5", minWidth: "44px", paddingTop: "2px" }}>{String(i + 1).padStart(2, "0")}</span>
              <div style={{ flex: 1 }}>
                <p style={{ fontSize: "17px", lineHeight: 1.5, margin: 0, color: isChecked ? "#A0A0A5" : "#0E0E10", textDecoration: isChecked ? "line-through" : "none", textDecorationThickness: "1px", fontWeight: 400 }}>{item.text}</p>
                {linkedModule && (
                  <span className="hx-eyebrow" onClick={(e) => { e.stopPropagation(); setActiveModule(linkedModule); setView("module"); }} style={{ marginTop: "6px", display: "inline-block", cursor: "pointer", textDecoration: "underline", textDecorationColor: "#D5D2CC" }}>
                    From /{item.from} · {linkedModule.title}
                  </span>
                )}
              </div>
              <div style={{ paddingTop: "2px" }}>{isChecked ? <CheckCircle2 size={22} color="#0E0E10" /> : <Circle size={22} color="#D5D2CC" />}</div>
            </div>
          );
        })}
      </div>
      <div style={{ padding: "60px 0", textAlign: "center" }}>
        <p className="hx-italic" style={{ fontSize: "20px", color: "#6B6B70", margin: "0 0 24px", maxWidth: "520px", marginLeft: "auto", marginRight: "auto", lineHeight: 1.4 }}>Hello craft. <span className="hx-grad-text">Meet conviction.</span></p>
        <button className="hx-btn-primary" onClick={() => setView("home")}>Back to the modules <ArrowRight size={16} /></button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
