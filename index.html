        </span>}
    </span>},HumanXMark=({size:e=30,showTagline:a=!1,color:i="#0E0E10"})=>LOGO_URL?<img src={LOGO_URL}alt="HumanX — elevate the experience"style={{height:`${Math.round(e*(a?1.7:1.05))}px`,width:"auto",display:"block"}}/>:<VectorLogo size={e}showTagline={a}color={i}/>,QUIZ=[{q:"A senior PM dismisses your proposal in the first 30 seconds. Your next move?",options:[{label:"Drop it. Pick a battle that's easier to win",pts:2},{label:"Send a follow-up doc with way more supporting detail",pts:5},{label:"Book a 1:1 to ask what she's optimising for, not to re-pitch",pts:10},{label:"Bring it up again in the next group review with allies present",pts:4}]},{q:"You need leadership to fund a redesign that won't show metrics for two quarters. You open with\u2026",options:[{label:"Side-by-side screenshots of competitors who already did this",pts:5},{label:"The cost of inaction \u2014 what we're losing every week we wait",pts:10},{label:"User quotes and a 90-second video reel of their frustration",pts:7},{label:"The Figma file with detailed annotations on what changes",pts:2}]},{q:"Engineering says 'this adds three weeks \u2014 can we cut it?' You respond with\u2026",options:[{label:"'Sure, what's the simplest version that still solves the problem?'",pts:6},{label:"'Walk me through the three weeks \u2014 where's the slowest part?'",pts:10},{label:"'Let me check with my design lead and get back to you'",pts:2},{label:"'It's not negotiable \u2014 this is critical for the user'",pts:4}]},{q:"You're opening a design review with the CEO in the room. You start with\u2026",options:[{label:"Screen one of the prototype, then click forward",pts:3},{label:"The user we're designing for and what's broken today",pts:10},{label:"Where this fits in the company's strategy and OKRs",pts:8},{label:"Three directions: ambitious, balanced, safe \u2014 let them weigh in",pts:6}]},{q:"Your design got vetoed last quarter. You still believe it's right. What do you do?",options:[{label:"Find a different stakeholder who'll champion it instead",pts:4},{label:"Quietly hold it. Wait for the right moment to bring it up again",pts:5},{label:"Come back with new data or a changed context \u2014 then revisit",pts:10},{label:"Re-pitch the same idea with stronger conviction and better slides",pts:3}]}],MODULES=[{id:"influence",num:"01",title:"The art of influence",sub:"The single most important skill AI can't replace",speaker:"Jessica Fain",org:"Lenny's Podcast \xB7 Webflow, ex-Slack",duration:"1h 34m",videoId:"RP4vJeIb7WU",thumbnailUrl:"https://i.ytimg.com/vi/RP4vJeIb7WU/maxresdefault.jpg",why:"Jessica was Chief of Staff to the CPO at Slack. She watched executives make decisions for years and figured out the pattern most product folks miss. The highest-signal episode Lenny has ever shipped on influence \u2014 and it's a masterclass in why most great ideas die unnecessarily.",takeaways:["Executive calendars are 'strobe lights' \u2014 the first 30 seconds of any meeting carry the whole context-setting load.","Stop pitching for approval. Start co-creating with the exec \u2014 go in to learn, not to convince.","When a leader says something that seems wrong: 'That's so interesting. What led you to believe that?' is the unlock."],exercise:"Before your next stakeholder review, write down what THEY are optimising for at the company level \u2014 not what you want from the meeting. Open with that, in 60 seconds."},{id:"articulate",num:"02",title:"Articulate your decisions",sub:"Defend your work without getting defensive",speaker:"Tom Greever",org:"Author, Articulating Design Decisions",duration:"55 min",videoId:"gCQIyH6i8YQ",thumbnailUrl:"https://i.ytimg.com/vi/gCQIyH6i8YQ/maxresdefault.jpg",why:"Tom literally wrote the book. The whole talk is about turning 'I don't like it' into a productive conversation \u2014 translating gut feedback into language you can actually engage with. Every product designer should watch this once a year.",takeaways:["Listen for the real concern hiding underneath the surface objection. 'Make it pop' is never about pop.","Frame every decision around the user's goal, not the pixel. Specifics beat aesthetics every time.","Close every review by repeating back what was decided \u2014 and put it in writing. Memory is unreliable; Slack is searchable."],exercise:"Next time someone gives vague feedback ('feels off', 'not right'), respond with one question: 'Tell me what you'd want a user to feel here.' Notice what shifts."},{id:"storytelling",num:"03",title:"Storytelling for product",sub:"Stop showing screens. Start telling stories.",speaker:"Donna Lichaw",org:"Author, The User's Journey",duration:"44 min",videoId:"o1BtPn7CsV8",thumbnailUrl:"https://i.ytimg.com/vi/o1BtPn7CsV8/maxresdefault.jpg",why:"Donna came from film and brings narrative structure to product. After this you'll never present a flow as a linear walkthrough again \u2014 you'll present it as a story with a hero, a stake, and a payoff. This single shift changes how rooms react to your work.",takeaways:["Every product moment has a beginning, middle, and end. So should your presentation.","Make the user the hero. Your design is the supporting cast \u2014 never the main character.","Find the cliffhanger \u2014 the moment of tension where the user almost gives up. Design for that, present from that."],exercise:"Take a flow you're working on. Write it out as three acts: setup (the user's situation), conflict (what's hard), resolution (how the design helps). Use this as your opening slide next review."},{id:"persuasion",num:"04",title:"The persuasion playbook",sub:"Behavioural economics for product designers",speaker:"Rory Sutherland",org:"Vice Chairman, Ogilvy \xB7 Author of Alchemy",duration:"1h",videoId:"8V__yo-T5wU",thumbnailUrl:"https://i.ytimg.com/vi/8V__yo-T5wU/maxresdefault.jpg",why:"Rory is the most quotable persuasion mind on the planet. This talk is the product designer's missing manual: why perception beats specification, why irrational solutions outperform logical ones, and why most of the value in a product lives in how it FEELS, not what it does.",takeaways:["Reframing is cheaper than rebuilding. Sometimes the design doesn't need to change \u2014 the language around it does.","Humans don't think what they feel, don't say what they think, and don't do what they say. Design for behaviour, not stated preference.","The opposite of a good idea can also be a good idea. Stop optimising \u2014 try inverting."],exercise:"Pick a feature your team is shipping. List five ways to make it FEEL more valuable without changing a single line of code. Bring the best one to your next standup."},{id:"taste",num:"05",title:"Taste, craft & quiet conviction",sub:"Making the case for opinionated work",speaker:"Karri Saarinen",org:"Lenny's Podcast \xB7 Co-founder & CEO, Linear",duration:"1h 40m",videoId:"4muxFVZ4XfM",thumbnailUrl:"https://i.ytimg.com/vi/4muxFVZ4XfM/maxresdefault.jpg",why:"Linear is the most-loved product on the internet \u2014 and Karri runs it without A/B tests, without focus groups, with one PM. This episode is gold because it's about communicating CONVICTION. How do you defend a design choice when the data is silent? Karri's answer rewires how you talk about taste.",takeaways:["Build opinionated software. The more you flatten options to please everyone, the more invisible you become.","Craft IS communication. A perfectly resolved interface tells stakeholders 'we know what we're doing' before you say a word.","When you can't measure it, name it. 'This feels right because\u2026' followed by a real reason is more persuasive than any chart."],exercise:"Find one place in your product where you've said 'we'll let users choose' to avoid a hard call. Make the call. Write a one-paragraph defence of it. Share it with your team."},{id:"feedback",num:"06",title:"The feedback loop",sub:"Receive without flinching. Give without flattening.",speaker:"Julie Zhuo",org:"Former VP Design, Facebook",duration:"32 min",videoId:"SWoZ5t5o24A",thumbnailUrl:"https://i.ytimg.com/vi/SWoZ5t5o24A/maxresdefault.jpg",why:"Julie ran design at Facebook through its hardest growth years. Her framing \u2014 feedback as a gift, not an audit \u2014 is the single biggest mindset shift most mid-level product designers need to unlock the next level.",takeaways:["Ask for feedback at the level you want it: task-specific, behavioural, or 360. Vague asks get vague answers.","When giving feedback: name the action, your reaction, the why. Optional: a suggestion. That's the whole formula.","Always check if it landed. 'Does that resonate?' is the secret weapon \u2014 it turns a monologue into a conversation."],exercise:"This week, ask one teammate for behavioural feedback (not work feedback). Try: 'What's one thing I do that helps the team, and one thing I could do differently?' Listen. Don't defend."}],BONUS={title:"The design process is dead",speaker:"Jenny Wen",org:"Head of Design at Claude \xB7 Lenny's Podcast",videoId:"eh8bcBIAAFo",blurb:"Jenny leads design at Anthropic and previously ran FigJam and Slides at Figma. In this March 2026 Lenny's episode, she argues the discovery \u2192 mock \u2192 iterate cycle most of us were taught is finished \u2014 and what's replacing it puts persuasion, taste, and conviction at the centre of the role. The most current take on what product design actually is right now."},CHECKLIST=[{id:"c1",from:"01",text:"Open every meeting by setting context in 60 seconds \u2014 the user, the goal, the ask."},{id:"c2",from:"01",text:"Go in to learn, not to convince. Map what your stakeholder is optimising for before you pitch."},{id:"c3",from:"01",text:"Use 'That's interesting \u2014 what led you to believe that?' instead of disagreeing."},{id:"c4",from:"02",text:"Trade 'I don't like it' for 'Tell me what you'd want a user to feel here.'"},{id:"c5",from:"02",text:"Close every review by writing down the decisions made. Memory fades; Slack is searchable."},{id:"c6",from:"03",text:"Open with the user problem, not the prototype. Make the user the hero."},{id:"c7",from:"03",text:"Find the cliffhanger \u2014 the moment a user nearly gives up \u2014 and present from there."},{id:"c8",from:"04",text:"Reframe before you rebuild. Often the design is fine; the language around it isn't."},{id:"c9",from:"04",text:"Design for behaviour, not stated preference. People don't do what they say."},{id:"c10",from:"05",text:"Make the call. When you let everyone 'choose', you become invisible."},{id:"c11",from:"06",text:"End every share with 'Does that resonate?' Turn monologues into conversations."},{id:"c12",from:"06",text:"Ask one teammate for behavioural feedback this month \u2014 not work feedback."}],getBand=e=>e<=40?{label:"The Quiet Maker",tagline:"Strong craft. Time to step into the room.",desc:"Your instinct is to let the work speak \u2014 that's a beautiful trait, and a ceiling. The most senior product designers you'll ever meet are also the most influential, not because they pitch louder, but because they understand how decisions actually get made. Start at Module 01 with Jessica Fain and move sequentially.",start:"influence"}:e<=70?{label:"The Persuader",tagline:"You move conversations. Now learn to move organisations.",desc:"You can hold your ground in a review and you've stopped saying 'because it looks better'. Storytelling and behavioural persuasion are where mid-level product designers level up to senior. Jump to Modules 03 and 04 \u2014 Donna Lichaw and Rory Sutherland will sharpen the edge.",start:"storytelling"}:{label:"The Influencer",tagline:"Top tier. Push the ceiling.",desc:"You communicate decisions, run reviews, and people actually do what you suggest. The next frontier: behavioural persuasion and quiet conviction at the executive level. Modules 04 (Sutherland) and 05 (Saarinen) are calibrated for you.",start:"persuasion"};function App(){const[e,a]=useState("home"),[i,t]=useState(null),[r,l]=useState(0),[n,c]=useState([]),[d,s]=useState({}),[o,g]=useState({}),[m,u]=u           The Art of <span className="hx-grad-text">Persuasion</span> Masterclass
        </h1><p style={{fontSize:"21px",maxWidth:"680px",lineHeight:1.5,color:"#3A3A3F",marginBottom:"48px",fontWeight:400}}>
          Six curated modules on influence, articulation, storytelling, and behavioural persuasion. Taught by Jessica Fain, Tom Greever, Donna Lichaw, Rory Sutherland, Karri Saarinen, and Julie Zhuo. Built for product designers who've realised the work alone isn't moving the org.
        </p><div style={{display:"flex",gap:"12px",flexWrap:"wrap"}}><button className="hx-btn-primary"onClick={()=>e("quiz")}><Sparkles size={16}/> Take the 2-minute quiz</button><button className="hx-btn-secondary"onClick={()=>e("checklist")}><ListChecks size={16}/> See the Persuasion Checklist</button></div></section><div className="hx-rule"/><section style={{padding:"80px 0",display:"grid",gridTemplateColumns:"1fr 2fr",gap:"80px",alignItems:"start"}}><h2 className="hx-display"style={{fontSize:"44px",margin:0,lineHeight:1}}>
          Don't just let the work<br/><span className="hx-italic hx-grad-text">do the talking.</span></h2><div style={{fontSize:"18px",lineHeight:1.6,color:"#1F1F23"}}><p style={{margin:"0 0 18px"}}>This isn't another course on Figma shortcuts or portfolio polish. It's not theory you'll forget by Friday.</p><p style={{margin:"0 0 18px"}}>It's a focused programme on the skills that compound — influence, articulation, storytelling, persuasion. The skills that turn craft into outcomes and designers into decision-makers.</p><p style={{margin:0,color:"#6B6B70"}}>Curated from Lenny's Podcast, Rory Sutherland, and the modern canon. Each module pairs a video with one drill you can run on real work this week.</p></div></section><div className="hx-rule"/><section style={{padding:"80px 0"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"end",marginBottom:"48px"}}><h2 className="hx-display"style={{fontSize:"44px",margin:0}}>The <span className="hx-italic">Talks</span></h2><span className="hx-eyebrow">Sequential or à la carte</span></div><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(340px, 1fr))",gap:"0",borderTop:"1px solid #E5E2DD"}}>
